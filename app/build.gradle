plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace 'com.josxtm.autocontrol.community'
    compileSdk 35
    defaultConfig {
        applicationId 'com.josxtm.autocontrol.community'
        minSdk 26
        targetSdk 35
        versionCode System.getenv('AUTOCONTROL_RELEASE_VERSION_CODE')?.toInteger() ?: 2
        versionName System.getenv('AUTOCONTROL_RELEASE_VERSION_NAME') ?: '0.2.0-public'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    signingConfigs {
        stableRelease {
            // Only enabled in the protected, manually triggered signing workflow.
            def ks = System.getenv('AUTOCONTROL_KEYSTORE_PATH')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('AUTOCONTROL_KEYSTORE_PASSWORD')
                keyAlias System.getenv('AUTOCONTROL_KEY_ALIAS')
                keyPassword System.getenv('AUTOCONTROL_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            // A stable signed channel is mandatory; unsigned release builds are not distributed.
            if (System.getenv('AUTOCONTROL_KEYSTORE_PATH')) {
                signingConfig signingConfigs.stableRelease
            }
            minifyEnabled false
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { compose true }
    packaging { resources.excludes += ['DebugProbesKt.bin', 'META-INF/DEPENDENCIES', 'META-INF/versions/**/OSGI-INF/**'] }
}
dependencies {
    implementation project(':storage')
    implementation project(':documents')
    implementation project(':ocr')
    implementation 'com.github.mwiede:jsch:2.28.8'
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2024.12.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
}
