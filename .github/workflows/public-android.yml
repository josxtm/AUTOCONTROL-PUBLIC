name: Public Android build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      AUTOCONTROL_BUILD_NUMBER: ${{ github.run_number }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Privacy gate (fail closed)
        run: python3 tools/privacy_guard.py .
      - name: Privacy gate tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests, Android Lint and isolated public preview
        run: gradle --no-daemon :storage:testDebugUnitTest :documents:testDebugUnitTest :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Verify APK identity, version, signature, permissions and resources
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/inspect_apk.py app/build/outputs/apk/debug/app-debug.apk "$ANDROID_HOME/build-tools/35.0.0" | tee app/build/apk-verification.txt
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare licensed OCR test model outside the APK
        run: |
          curl --fail --location --retry 2 https://raw.githubusercontent.com/tesseract-ocr/tessdata_fast/4.1.0/eng.traineddata -o "$RUNNER_TEMP/synthetic-ocr-model.traineddata"
          echo "7d4322bd2a7749724879683fc3912cb542f19906c83bcc1a52132556427170b2  $RUNNER_TEMP/synthetic-ocr-model.traineddata" | sha256sum --check
      - name: Real Android storage, recovery, Compose and local OCR tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_c
          disable-animations: true
          script: |
            adb push "$RUNNER_TEMP/synthetic-ocr-model.traineddata" /data/local/tmp/synthetic-ocr-model.traineddata
            adb shell wm size 1920x1200
            adb shell wm density 240
            adb shell settings put system accelerometer_rotation 0
            adb shell settings put system user_rotation 0
            gradle --no-daemon :app:connectedDebugAndroidTest
            mkdir -p app/build/reports/android-screenshots
            adb pull /sdcard/Download/autocontrol-tablet-sniffer.png app/build/reports/android-screenshots/tablet-sniffer.png
            for module in inicio centros sniffer-v2 pes-bdi documentos diario copias configuracion; do adb pull "/sdcard/Download/autocontrol-layout-$module.png" "app/build/reports/android-screenshots/$module.png"; done
            python3 -c 'from pathlib import Path; p=Path("app/build/reports/android-screenshots/tablet-sniffer.png"); assert p.stat().st_size > 10000 and p.read_bytes()[:8] == bytes([137,80,78,71,13,10,26,10]), "Invalid emulator PNG"'

      - name: Name APK with tablet version and compilation
        shell: bash
        run: |
          set -euo pipefail
          test -s app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk "app/build/outputs/apk/debug/AutoControL_tablet_v.1.0 - comp. ${AUTOCONTROL_BUILD_NUMBER}.apk"
      - name: Upload validated public preview
        uses: actions/upload-artifact@v4
        with:
          name: AutoControL_tablet_v.1.0 - comp. ${{ github.run_number }}
          path: |
            app/build/outputs/apk/debug/AutoControL_tablet_v.1.0 - comp. *.apk
            app/build/apk-verification.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AUTOCONTROL-PUBLIC-VALIDATION
          path: |
            app/build/reports/
            storage/build/reports/
            documents/build/reports/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
