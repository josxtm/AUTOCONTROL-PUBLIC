name: Stable signed AutoControL APK
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: autocontrol-stable-release
  cancel-in-progress: false
jobs:
  signed-apk:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: autocontrol-signing
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify signing secrets are configured
        env:
          KEYSTORE_B64: ${{ secrets.AUTOCONTROL_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.AUTOCONTROL_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AUTOCONTROL_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.AUTOCONTROL_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ vars.AUTOCONTROL_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          for var in KEYSTORE_B64 STORE_PASS KEY_ALIAS KEY_PASS EXPECTED_CERT; do
            test -n "${!var}" || { echo "Signing is not configured: $var"; exit 1; }
          done
          [[ "$EXPECTED_CERT" =~ ^[a-fA-F0-9]{64}$ ]] || { echo "Expected SHA-256 certificate digest invalid"; exit 1; }
      - name: Privacy checks
        run: |
          python3 tools/privacy_guard.py .
          python3 -m unittest discover -s tests -p 'test_*.py'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Decode keystore outside repository
        env:
          KEYSTORE_B64: ${{ secrets.AUTOCONTROL_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/autocontrol-release.jks"
          test -s "$RUNNER_TEMP/autocontrol-release.jks"
      - name: Build and sign with permanent key
        env:
          AUTOCONTROL_KEYSTORE_PASSWORD: ${{ secrets.AUTOCONTROL_KEYSTORE_PASSWORD }}
          AUTOCONTROL_KEY_ALIAS: ${{ secrets.AUTOCONTROL_KEY_ALIAS }}
          AUTOCONTROL_KEY_PASSWORD: ${{ secrets.AUTOCONTROL_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          echo "AUTOCONTROL_KEYSTORE_PATH=$RUNNER_TEMP/autocontrol-release.jks" >> "$GITHUB_ENV"
          echo "AUTOCONTROL_RELEASE_VERSION_CODE=$((10000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "AUTOCONTROL_RELEASE_VERSION_NAME=0.3.$GITHUB_RUN_NUMBER-public" >> "$GITHUB_ENV"
      - name: Run tests, Lint, and assemble signed APK
        env:
          AUTOCONTROL_KEYSTORE_PASSWORD: ${{ secrets.AUTOCONTROL_KEYSTORE_PASSWORD }}
          AUTOCONTROL_KEY_ALIAS: ${{ secrets.AUTOCONTROL_KEY_ALIAS }}
          AUTOCONTROL_KEY_PASSWORD: ${{ secrets.AUTOCONTROL_KEY_PASSWORD }}
        run: |
          gradle --no-daemon :storage:testDebugUnitTest :documents:testDebugUnitTest :app:testDebugUnitTest :app:lintRelease :app:assembleRelease
      - name: Check stable signature and APK contents
        env:
          EXPECTED_CERT: ${{ vars.AUTOCONTROL_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          apksigner="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$apksigner" verify --print-certs "$APK" > "$RUNNER_TEMP/cert-details.txt"
          actual="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/cert-details.txt" | head -1)"
          test -n "$actual" || { echo "No certificate digest found"; exit 1; }
          [[ "${actual,,}" == "${EXPECTED_CERT,,}" ]] || { echo "Certificate does not match stable release identity"; exit 1; }
          python3 tools/inspect_apk.py "$APK" "$ANDROID_HOME/build-tools/35.0.0" | tee app/build/apk-release-verification.txt
          echo "Stable signing certificate matched expected SHA-256."
      - name: Remove private signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/autocontrol-release.jks" "$RUNNER_TEMP/cert-details.txt"
      - name: Upload validated stable update APK
        uses: actions/upload-artifact@v4
        with:
          name: AUTOCONTROL-STABLE-UPDATE-APK
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/apk-release-verification.txt
          if-no-files-found: error
          retention-days: 30
